
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelEase - Mobile Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <!-- Loading Indicator -->
    <div id="loading" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 shadow-xl">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mx-auto"></div>
            <p class="mt-4 text-gray-700">Se încarcă datele din Google Sheets...</p>
        </div>
    </div>

    <div class="min-h-screen flex flex-col">
        <!-- Navigation -->
        <nav class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <i data-feather="droplet" class="text-primary h-6 w-6"></i>
                        <span class="ml-2 text-xl font-semibold text-gray-900">FuelEase Mobile</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="showTab('dashboard')" class="tab-btn text-xs sm:text-sm text-gray-900 bg-gray-100 px-2 sm:px-3 py-2 rounded-md font-medium">Dashboard</button>
                        <button onclick="showTab('fuel')" class="tab-btn text-xs sm:text-sm text-gray-700 hover:text-gray-900 px-2 sm:px-3 py-2 rounded-md font-medium">Alimentări</button>
                        <button onclick="showTab('mileage')" class="tab-btn text-xs sm:text-sm text-gray-700 hover:text-gray-900 px-2 sm:px-3 py-2 rounded-md font-medium">Kilometraj</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-1 py-4 sm:py-8">
            <div class="max-w-7xl mx-auto px-2 sm:px-4 lg:px-8">

                <!-- Dashboard Tab -->
                <div id="dashboard-tab" class="tab-content">
                    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-4 sm:mb-6">Dashboard</h1>

                    <!-- Statistics Cards -->
                    <div class="grid grid-cols-2 gap-3 sm:gap-6 mb-6 sm:mb-8">
                        <div class="bg-white rounded-lg shadow p-3 sm:p-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-xs sm:text-sm text-gray-600">Total Litri</p>
                                    <p id="stat-total-liters" class="text-lg sm:text-2xl font-bold text-gray-900">-</p>
                                </div>
                                <i data-feather="droplet" class="text-primary h-6 w-6 sm:h-8 sm:w-8"></i>
                            </div>
                        </div>
                        <div class="bg-white rounded-lg shadow p-3 sm:p-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-xs sm:text-sm text-gray-600">Total Bani</p>
                                    <p id="stat-total-cost" class="text-lg sm:text-2xl font-bold text-gray-900">-</p>
                                </div>
                                <i data-feather="dollar-sign" class="text-green-500 h-6 w-6 sm:h-8 sm:w-8"></i>
                            </div>
                        </div>
                        <div class="bg-white rounded-lg shadow p-3 sm:p-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-xs sm:text-sm text-gray-600">Preț Mediu</p>
                                    <p id="stat-avg-price" class="text-lg sm:text-2xl font-bold text-gray-900">-</p>
                                </div>
                                <i data-feather="trending-up" class="text-blue-500 h-6 w-6 sm:h-8 sm:w-8"></i>
                            </div>
                        </div>
                        <div class="bg-white rounded-lg shadow p-3 sm:p-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-xs sm:text-sm text-gray-600">Kilometri</p>
                                    <p id="stat-current-km" class="text-lg sm:text-2xl font-bold text-gray-900">-</p>
                                </div>
                                <i data-feather="navigation" class="text-purple-500 h-6 w-6 sm:h-8 sm:w-8"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Charts -->
                    <div class="bg-white rounded-lg shadow p-4 sm:p-6 mb-4 sm:mb-8">
                        <h2 class="text-lg sm:text-xl font-bold mb-4">Evoluție Preț/Litru</h2>
                        <canvas id="priceChart"></canvas>
                    </div>

                    <div class="bg-white rounded-lg shadow p-4 sm:p-6">
                        <h2 class="text-lg sm:text-xl font-bold mb-4">Evoluție Kilometraj</h2>
                        <canvas id="mileageChart"></canvas>
                    </div>
                </div>

                <!-- Fuel Tab -->
                <div id="fuel-tab" class="tab-content hidden">
                    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-4 sm:mb-6">Alimentări</h1>
                    <div class="bg-white rounded-lg shadow overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 text-xs sm:text-sm">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-2 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Data</th>
                                    <th class="px-2 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Litri</th>
                                    <th class="px-2 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Preț/L</th>
                                    <th class="px-2 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Stație</th>
                                    <th class="px-2 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Total</th>
                                </tr>
                            </thead>
                            <tbody id="fuelTableBody" class="bg-white divide-y divide-gray-200">
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Mileage Tab -->
                <div id="mileage-tab" class="tab-content hidden">
                    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-4 sm:mb-6">Kilometraj</h1>
                    <div class="bg-white rounded-lg shadow overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 text-xs sm:text-sm">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-2 sm:px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Data</th>
                                    <th class="px-2 sm:px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Km</th>
                                    <th class="px-2 sm:px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Alimentat</th>
                                    <th class="px-2 sm:px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Consum</th>
                                </tr>
                            </thead>
                            <tbody id="mileageTableBody" class="bg-white divide-y divide-gray-200">
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        // ⚠️ ÎNLOCUIEȘTE CU ID-URILE TALE DE GOOGLE SHEETS!
        const FUEL_SHEET_ID = '1ib9l8H6EArueA9lxUyvTScpddawke1A_';  // Ex: '1abc...xyz'
        const MILEAGE_SHEET_ID ='1lerFg9LFhOhPV7AfzztG75EgRkXsPA0r';
        
        let charts = {};
        let fuelData = [];
        let mileageData = [];

        // Funcție pentru citire din Google Sheets
        async function loadGoogleSheet(sheetId, range = 'Sheet1!A:Z') {
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${range}`;
            try {
                const response = await fetch(url);
                const text = await response.text();
                const json = JSON.parse(text.substr(47).slice(0, -2));
                return json.table.rows;
            } catch (error) {
                console.error('Error loading sheet:', error);
                return [];
            }
        }

        function formatDate(dateValue) {
            if (!dateValue || !dateValue.v) return '-';
            const date = new Date(dateValue.v);
            return date.toISOString().split('T')[0];
        }

        function getCellValue(cell, defaultValue = 0) {
            if (!cell || cell.v === null) return defaultValue;
            return cell.v;
        }

        async function loadAllData() {
            try {
                // Încarcă date combustibil
                const fuelRows = await loadGoogleSheet(FUEL_SHEET_ID);
                fuelData = fuelRows.slice(1).map(row => ({
                    date: formatDate(row.c[0]),
                    liters: getCellValue(row.c[1], 0),
                    price_per_liter: getCellValue(row.c[2], 0),
                    station: getCellValue(row.c[3], ''),
                    cost: getCellValue(row.c[4], 0)
                }));

                // Încarcă date kilometraj
                const mileageRows = await loadGoogleSheet(MILEAGE_SHEET_ID);
                mileageData = mileageRows.slice(1).map(row => ({
                    date: formatDate(row.c[0]),
                    mileage: getCellValue(row.c[1], 0),
                    refueled: getCellValue(row.c[2], 'Nu'),
                    fuel_added: getCellValue(row.c[3], 0),
                    fuel_remaining: getCellValue(row.c[4], 0),
                    consumption: getCellValue(row.c[6], 0)
                }));

                updateStatistics();
                loadDashboard();
                
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Error loading data:', error);
                alert('Eroare la încărcarea datelor din Google Sheets. Verifică ID-urile!');
            }
        }

        function updateStatistics() {
            const totalLiters = fuelData.reduce((sum, r) => sum + parseFloat(r.liters || 0), 0);
            const totalCost = fuelData.reduce((sum, r) => sum + parseFloat(r.cost || 0), 0);
            const avgPrice = fuelData.reduce((sum, r) => sum + parseFloat(r.price_per_liter || 0), 0) / fuelData.length;
            const currentKm = mileageData.length > 0 ? mileageData[mileageData.length - 1].mileage : 0;

            document.getElementById('stat-total-liters').textContent = totalLiters.toFixed(2) + ' L';
            document.getElementById('stat-total-cost').textContent = totalCost.toFixed(2) + ' RON';
            document.getElementById('stat-avg-price').textContent = avgPrice.toFixed(2) + ' RON';
            document.getElementById('stat-current-km').textContent = currentKm.toLocaleString() + ' km';
        }

        function loadDashboard() {
            createPriceChart();
            createMileageChart();
        }

        function createPriceChart() {
            const ctx = document.getElementById('priceChart');
            if (charts['priceChart']) charts['priceChart'].destroy();
            
            charts['priceChart'] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: fuelData.slice(-20).map(r => r.date),
                    datasets: [{
                        label: 'Preț/Litru (RON)',
                        data: fuelData.slice(-20).map(r => r.price_per_liter),
                        borderColor: '#3b82f6',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: true } }
                }
            });
        }

        function createMileageChart() {
            const ctx = document.getElementById('mileageChart');
            if (charts['mileageChart']) charts['mileageChart'].destroy();
            
            charts['mileageChart'] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: mileageData.map(r => r.date),
                    datasets: [{
                        label: 'Kilometri',
                        data: mileageData.map(r => r.mileage),
                        borderColor: '#10b981',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: true } }
                }
            });
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-gray-100', 'text-gray-900');
                btn.classList.add('text-gray-700');
            });
            
            document.getElementById(tabName + '-tab').classList.remove('hidden');
            event.target.classList.add('bg-gray-100', 'text-gray-900');

            if (tabName === 'fuel') loadFuelTable();
            if (tabName === 'mileage') loadMileageTable();
        }

        function loadFuelTable() {
            const tbody = document.getElementById('fuelTableBody');
            tbody.innerHTML = '';
            
            fuelData.forEach(record => {
                const row = `
                    <tr class="hover:bg-gray-50">
                        <td class="px-2 sm:px-6 py-3 text-gray-900">${record.date}</td>
                        <td class="px-2 sm:px-6 py-3 text-gray-900">${parseFloat(record.liters).toFixed(2)}</td>
                        <td class="px-2 sm:px-6 py-3 text-gray-900">${parseFloat(record.price_per_liter).toFixed(2)}</td>
                        <td class="px-2 sm:px-6 py-3 text-gray-900">${record.station}</td>
                        <td class="px-2 sm:px-6 py-3 font-medium text-gray-900">${parseFloat(record.cost).toFixed(2)}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function loadMileageTable() {
            const tbody = document.getElementById('mileageTableBody');
            tbody.innerHTML = '';
            
            mileageData.forEach(record => {
                const row = `
                    <tr class="hover:bg-gray-50">
                        <td class="px-2 sm:px-4 py-3 text-gray-900">${record.date}</td>
                        <td class="px-2 sm:px-4 py-3 text-gray-900">${parseInt(record.mileage).toLocaleString()}</td>
                        <td class="px-2 sm:px-4 py-3 text-gray-900">${record.refueled}</td>
                        <td class="px-2 sm:px-4 py-3 text-gray-900">${parseFloat(record.consumption).toFixed(2)}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // Inițializare
        document.addEventListener('DOMContentLoaded', function() {
            feather.replace();
            loadAllData();
        });
    </script>
</body>

</html>
